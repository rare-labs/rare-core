name: Reference validation

on:
  workflow_dispatch:

jobs:
  pyextremes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install with reference extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,reference]"

      - name: Fit with pyextremes
        run: python -m validation.run_pyextremes

      - name: Compare to engine
        run: python -m validation.compare

  extremes-jl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Install Extremes.jl pin and JSON
        run: |
          julia -e 'using Pkg; Pkg.add("JSON"); Pkg.add(url="https://github.com/jojal5/Extremes.jl", rev="fa757a2acb58669067ceef7bf7a3f1ecc6cfe2dc")'

      - name: Fit with Extremes.jl
        run: julia validation/run_extremes_jl.jl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compare to engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m validation.compare
